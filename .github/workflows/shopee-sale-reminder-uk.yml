name: Shopee Sale Reminder (UK)

on:
  # Daily at 02:00 UTC (10:00 Asia/Singapore)
  schedule:
    - cron: "0 2 * * *"

  # Manual trigger with optional test inputs
  workflow_dispatch:
    inputs:
      date:
        description: "Test date (YYYY-MM-DD in SGT, optional)"
        required: false
        type: string
      dry_run:
        description: "Dry run (log only, no Discord post)"
        required: false
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    environment: uk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run reminder script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date=${{ inputs.date }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          bun run src/remind.ts $ARGS

