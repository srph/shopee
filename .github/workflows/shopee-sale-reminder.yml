name: Shopee Sale Reminder

on:
  # Daily at 02:00 UTC (10:00 Asia/Singapore)
  schedule:
    - cron: "0 2 * * *"

  # Manual trigger with optional test inputs
  workflow_dispatch:
    inputs:
      date:
        description: "Test date (YYYY-MM-DD in SGT, optional)"
        required: false
        type: string
      dry_run:
        description: "Dry run (log only, no Discord post)"
        required: false
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run reminder script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date=${{ inputs.date }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node --loader ts-node/esm src/remind.ts $ARGS
